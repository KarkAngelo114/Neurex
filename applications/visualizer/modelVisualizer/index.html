<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width=device-width, initial-scale = 1.0">
        <link rel="stylesheet" href = "style.css"/>
        <link rel="stylesheet" href = "gradient-background.css"/>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
        </script>
        <title>Model Visualizer</title>
    </head>
    <body>
        
        <section class="main-div">

            <div id="hidden">
                <button class="exit-full-screen-nav-button" onclick="exitFullScreen()">Exit Full Screen</button>
            </div>

            <div id="top-nav">
                <p><b>Model Visualizer</b></p>
                <button class="top-nav-button" onclick="viewFullScreen()">View Full screen</button>
                <button class="top-nav-button" onclick="takeScreenshot()">Take a Screenshot</button>
                <button class="top-nav-button" id = "gridControllerButton" onclick="gridDisplayController()"></button>
            </div>

            <div id="renderer"></div>
            <div id="tooltip"></div>
            
            <div id="bottom-nav">
                <div style="display: grid; place-items:center;">
                    <div style="width: 100%; text-align: left;">
                        <p>Input shape: <span id="inputShape">Fetching data...</span></p>
                        <p>Number of Layers: <span id = "numLayers">Fetching data...</span></p>
                    </div>
                </div>
                <div class="scrollable">
                    <div id="list"> Fetching layers...</div>
                </div>
            </div>

            
        </section>
    </body>
    <script src="L1.js"></script>
    <script type="module" src="api.js"></script>
    <script src="button-actions.js"></script>
</html>
