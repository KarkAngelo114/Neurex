<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width=device-width, initial-scale = 1.0">
        <link rel="stylesheet" href = "style.css"/>
        <link rel="stylesheet" href = "gradient-background.css"/>
        <script type="importmap">
        {
            "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
        </script>
        <title>Model Visualizer</title>
    </head>
    <body>
        
        <section class="left-div">
            <div id="renderer"></div>
            <div id="tooltip"></div>
            <div class="right-div">
                <img src="logo.png" class="logo"/>
                <div style="text-align: left; display: flex; flex-direction: column; height: 100%;">
                    <p style="margin: 4px 0;">Input shape: <span id="inputShape">Fetching data...</span></p>
                    <p style="margin: 4px 0;">Number of Layers: <span id = "numLayers">Fetching data...</span></p>
                    <div class="layer-list-container">
                        <div id="list"></div>
                    </div>
                </div>
            </div>

            
        </section>
    </body>
    <script type="module" src="api.js"></script>
</html>
