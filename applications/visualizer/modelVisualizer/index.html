<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width=device-width, initial-scale = 1.0">
        <link rel="stylesheet" href = "style.css"/>
        <link rel="stylesheet" href = "gradient-background.css"/>
        <script type="importmap">
        {
            "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
        </script>
        <title>Model Visualizer</title>
    </head>
    <body>
        <header class="solar-flare-gradient-bg"></header>
        
        <section class="dashboard">
            <aside>
                <div class="right-div">
                    <img src="logo.png" class="logo"/>
                    <div style="text-align: left; height:50vh;">
                        <p>Input shape: <span id = "inputShape">Fetching data...</span></p>
                    </div>
                    <p class="version_tag">Version: <span id = "version">Fetching data...</span></p>
                </div>
            </aside>
            <section class="left-div">
                <!-- model renderer -->
                <div id = "renderer"></div>
                <div id = "tooltip"></div>
            </section>
        </section>
    </body>
    <script type="module" src="api.js"></script>
</html>
